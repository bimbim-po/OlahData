app = "olahdata-stats"
primary_region = "sin" # Singapore (closest to Indonesia for low latency)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  HOST = "0.0.0.0"
  ENVIRONMENT = "production"
  ENGINE_VERSION = "2.0.0"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb" # Sufficient for SciPy/statsmodels computation
